# Miracles iOS — بناء للمحاكي + صور شاشة (بدون حساب Apple Developer)
# يشتغل لحاله مع كل رفع، أو من Actions ← «iOS build» ← Run workflow
name: iOS build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange files (flat upload -> project folders)
        run: |
          # الملفات اترفعت من غير مجلدات: نرتّبوها هني (لو المجلدات موجودة أصلاً ما يتغيرش شي)
          if [ ! -d Miracles ]; then
            A=Miracles/Assets.xcassets
            mkdir -p $A/AppIcon.appiconset $A/Splash.imageset $A/SplashMark.imageset
            mv *.swift LaunchScreen.storyboard Miracles/
            mv icon-1024.png $A/AppIcon.appiconset/
            mv splash@1x.png splash@2x.png splash@3x.png $A/Splash.imageset/
            mv mark@1x.png mark@2x.png mark@3x.png $A/SplashMark.imageset/
            echo '{ "info" : { "author" : "xcode", "version" : 1 } }' > $A/Contents.json
            echo '{ "images" : [ { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }' > $A/AppIcon.appiconset/Contents.json
            for n in Splash:splash SplashMark:mark; do
              d=${n%%:*}; f=${n##*:}
              echo "{ \"images\" : [ { \"filename\" : \"$f@1x.png\", \"idiom\" : \"universal\", \"scale\" : \"1x\" }, { \"filename\" : \"$f@2x.png\", \"idiom\" : \"universal\", \"scale\" : \"2x\" }, { \"filename\" : \"$f@3x.png\", \"idiom\" : \"universal\", \"scale\" : \"3x\" } ], \"info\" : { \"author\" : \"xcode\", \"version\" : 1 } }" > $A/$d.imageset/Contents.json
            done
          fi
          find Miracles -type f | sort
          for f in $(find Miracles -name Contents.json); do python3 -m json.tool "$f" > /dev/null || { echo "BAD JSON $f"; exit 1; }; done

      - name: Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Simulator)
        run: |
          mkdir -p out
          if ! xcodebuild -project Miracles.xcodeproj -scheme Miracles -configuration Debug \
               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
               -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > out/build.log 2>&1; then
            echo "================ BUILD FAILED — الأخطاء ================"
            grep -E "error:|fatal error|\*\* BUILD FAILED" out/build.log | head -60
            echo "========================================================="
            tail -40 out/build.log
            exit 1
          fi
          grep -E "warning:" out/build.log | sort -u | head -40 || true
          echo "BUILD OK"

      - name: Run on Simulator + screenshots
        run: |
          set -x
          APP=$(find build/Build/Products -maxdepth 2 -name "Miracles.app" -type d | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  n = x["name"]
                  if not n.startswith("iPhone"): continue
                  score = (n == "iPhone 16", n.startswith("iPhone 16"), ver(rt))
                  if best is None or score > best[0]: best = (score, x["udid"], n, rt)
          print(best[1]); print(best[2], best[3], file=sys.stderr)
          ')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p out/shots
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/shots/open.mp4 &
          REC=$!
          sleep 2
          xcrun simctl launch "$UDID" ly.miracles.app
          for t in 1 2 4 8 15; do
            sleep $([ $t = 1 ] && echo 1 || echo $((t - prev)))
            prev=$t
            xcrun simctl io "$UDID" screenshot "out/shots/first-open-${t}s.png"
          done
          kill -INT $REC || true
          sleep 3
          # فتحة ثانية (بعد ما تسكّر): الكاش والدخول محفوظين
          xcrun simctl terminate "$UDID" ly.miracles.app || true
          sleep 2
          xcrun simctl launch "$UDID" ly.miracles.app
          sleep 6
          xcrun simctl io "$UDID" screenshot out/shots/second-open-6s.png
          ls -la out/shots

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracles-ios-${{ github.run_number }}
          path: out/
          retention-days: 14
