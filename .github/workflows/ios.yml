# Miracles iOS — V5: بناء للتلفون الحقيقي ← Miracles.ipa (بدون توقيع، بدون حساب Apple Developer)
# الـ ipa يتوقّع وقت التثبيت (Sideloadly بحساب Apple ID، أو لاحقاً TestFlight). ما فيش محاكي.
# يشتغل لحاله مع كل رفع، أو من Actions ← «iOS build» ← Run workflow
name: iOS build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange files (flat upload -> project folders)
        run: |
          # الملفات اترفعت من غير مجلدات: نرتّبوها هني (لو المجلدات موجودة أصلاً ما يتغيرش شي)
          if [ ! -d Miracles ]; then
            A=Miracles/Assets.xcassets
            mkdir -p $A/AppIcon.appiconset $A/Splash.imageset $A/SplashMark.imageset
            mv *.swift LaunchScreen.storyboard Miracles/
            mv icon-1024.png $A/AppIcon.appiconset/
            mv splash@1x.png splash@2x.png splash@3x.png $A/Splash.imageset/
            mv mark@1x.png mark@2x.png mark@3x.png $A/SplashMark.imageset/
            echo '{ "info" : { "author" : "xcode", "version" : 1 } }' > $A/Contents.json
            echo '{ "images" : [ { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }' > $A/AppIcon.appiconset/Contents.json
            for n in Splash:splash SplashMark:mark; do
              d=${n%%:*}; f=${n##*:}
              echo "{ \"images\" : [ { \"filename\" : \"$f@1x.png\", \"idiom\" : \"universal\", \"scale\" : \"1x\" }, { \"filename\" : \"$f@2x.png\", \"idiom\" : \"universal\", \"scale\" : \"2x\" }, { \"filename\" : \"$f@3x.png\", \"idiom\" : \"universal\", \"scale\" : \"3x\" } ], \"info\" : { \"author\" : \"xcode\", \"version\" : 1 } }" > $A/$d.imageset/Contents.json
            done
          fi
          find Miracles -type f | sort
          for f in $(find Miracles -name Contents.json); do python3 -m json.tool "$f" > /dev/null || { echo "BAD JSON $f"; exit 1; }; done

      - name: Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iPhone, unsigned)
        run: |
          mkdir -p out
          if ! xcodebuild -project Miracles.xcodeproj -scheme Miracles -configuration Release \
               -sdk iphoneos -destination 'generic/platform=iOS' \
               -derivedDataPath build \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
               build > out/build.log 2>&1; then
            echo "================ BUILD FAILED — الأخطاء ================"
            grep -E "error:|fatal error|\*\* BUILD FAILED" out/build.log | head -60
            echo "========================================================="
            tail -40 out/build.log
            exit 1
          fi
          grep -E "warning:" out/build.log | sort -u | head -40 || true
          echo "BUILD OK"

      - name: Package Miracles.ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Miracles.app
          test -d "$APP" || { echo "Miracles.app not found"; find build/Build/Products -maxdepth 2; exit 1; }
          # فحص سريع: المعرّف، النسخة، والمعالج (arm64 = آيفون حقيقي)
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | tee out/info.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" | tee -a out/info.txt
          lipo -info "$APP/Miracles" | tee -a out/info.txt
          grep -q "ly.miracles.app" out/info.txt || { echo "wrong bundle id"; exit 1; }
          grep -q "arm64" out/info.txt || { echo "not an iPhone (arm64) build"; exit 1; }
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry ../out/Miracles.ipa Payload)
          ls -la out/

      - name: Upload Miracles.ipa + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracles-ios-ipa-${{ github.run_number }}
          path: out/
          retention-days: 14
